<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>42U — Equipment Rack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2330;
      --steel: #5a6678;
      --mist: #f4f7fb;
      --amber: #d4892a;
      --signal: #1f9d62;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--mist);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background:
        radial-gradient(ellipse 90% 60% at 50% 12%, #ffffff 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 85%, #d9e6f2 0%, transparent 50%),
        linear-gradient(165deg, #eef3f8 0%, #e2eaf2 48%, #d7e2ec 100%);
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      padding: clamp(1rem, 3vw, 2.5rem);
      padding-top: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .brand {
      justify-self: start;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand h1 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(2.6rem, 10vw, 7rem);
      line-height: 0.88;
      letter-spacing: -0.04em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .brand p {
      margin-top: 0.65rem;
      max-width: 28ch;
      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--steel);
      letter-spacing: 0.02em;
    }

    .meta {
      align-self: end;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.75rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--steel);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .meta i {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 8px color-mix(in srgb, var(--signal) 55%, transparent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .hint {
      position: fixed;
      right: clamp(1rem, 3vw, 2.5rem);
      bottom: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-bottom));
      z-index: 2;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--steel) 80%, transparent);
      pointer-events: none;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @media (max-width: 640px) {
      .brand h1 { font-size: clamp(2.2rem, 14vw, 3.4rem); }
      .brand p { max-width: 32ch; font-size: 0.7rem; }
      .meta { gap: 0.75rem 1.1rem; max-width: 70%; }
      .hint { max-width: 12ch; text-align: right; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Interactive 3D model of a 42U equipment rack"></canvas>

  <div class="hud">
    <header class="brand">
      <h1>42U</h1>
      <p>Full-height EIA-310 equipment rack. Drag to orbit. Pinch to zoom.</p>
    </header>
    <div></div>
    <footer class="meta">
      <span><i></i> Live render</span>
      <span>19″ rails · 42 units</span>
      <span>Depth 1000 mm</span>
    </footer>
  </div>
  <div class="hint">Orbit · Zoom · Pan</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    // --- EIA-310 proportions (scene units ≈ centimeters) ---
    const U = 4.445;
    const UNITS = 42;
    const RAIL_WIDTH = 48.26;
    const OUTER_W = 60;
    const OUTER_D = 100;
    const FRAME_T = 2.2;
    const INNER_H = UNITS * U;
    const BASE_H = 8;
    const TOP_H = 4;
    const TOTAL_H = BASE_H + INNER_H + TOP_H;

    const canvas = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    // Soft distance haze — light studio, not a dark void
    scene.fog = new THREE.Fog(0xe8eef4, 280, 720);

    const isMobile = () => window.matchMedia("(max-width: 640px), (pointer: coarse)").matches;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 2000);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 40;
    controls.maxDistance = 900;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minPolarAngle = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.enablePan = true;
    controls.screenSpacePanning = true;

    let idleTimer;
    const kickIdle = () => {
      controls.autoRotate = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { controls.autoRotate = true; }, 4500);
    };
    controls.addEventListener("start", kickIdle);

    // --- Bright studio materials ---
    const matFrame = new THREE.MeshStandardMaterial({
      color: 0xc5ced8,
      metalness: 0.72,
      roughness: 0.28,
    });
    const matRail = new THREE.MeshStandardMaterial({
      color: 0x9aa6b4,
      metalness: 0.8,
      roughness: 0.3,
    });
    const matPanel = new THREE.MeshStandardMaterial({
      color: 0xd8dee6,
      metalness: 0.45,
      roughness: 0.5,
    });
    const matServer = new THREE.MeshStandardMaterial({
      color: 0x3a4554,
      metalness: 0.55,
      roughness: 0.45,
    });
    const matFace = new THREE.MeshStandardMaterial({
      color: 0x2c3542,
      metalness: 0.35,
      roughness: 0.55,
    });
    const matAccent = new THREE.MeshStandardMaterial({
      color: 0x5b6a7c,
      metalness: 0.5,
      roughness: 0.42,
    });
    const matBlank = new THREE.MeshStandardMaterial({
      color: 0xb8c2ce,
      metalness: 0.4,
      roughness: 0.55,
    });
    const matCaster = new THREE.MeshStandardMaterial({
      color: 0x4a5360,
      metalness: 0.35,
      roughness: 0.65,
    });
    const matFloor = new THREE.MeshStandardMaterial({
      color: 0xdfe6ee,
      metalness: 0.08,
      roughness: 0.95,
    });
    const matLedOn = new THREE.MeshStandardMaterial({
      color: 0x1f9d62,
      emissive: 0x1f9d62,
      emissiveIntensity: 1.2,
      metalness: 0.2,
      roughness: 0.35,
    });
    const matLedAmber = new THREE.MeshStandardMaterial({
      color: 0xd4892a,
      emissive: 0xd4892a,
      emissiveIntensity: 1.0,
      metalness: 0.2,
      roughness: 0.35,
    });
    const matLedDim = new THREE.MeshStandardMaterial({
      color: 0x6a736c,
      emissive: 0x1a2218,
      emissiveIntensity: 0.05,
      metalness: 0.2,
      roughness: 0.5,
    });

    const rack = new THREE.Group();
    scene.add(rack);

    function box(w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function rounded(w, h, d, r, mat, x, y, z) {
      const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const floor = new THREE.Mesh(new THREE.CircleGeometry(220, 64), matFloor);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(48, 92, 64),
      new THREE.MeshBasicMaterial({
        color: 0x9eb0c4,
        transparent: true,
        opacity: 0.28,
        side: THREE.DoubleSide,
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.05;
    scene.add(ring);

    rack.add(rounded(OUTER_W + 2, BASE_H, OUTER_D + 2, 0.4, matFrame, 0, BASE_H / 2, 0));

    const casterY = 1.2;
    [[-24, -40], [24, -40], [-24, 40], [24, 40]].forEach(([cx, cz]) => {
      rack.add(box(5, 2.4, 5, matCaster, cx, casterY, cz));
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(1.4, 1.4, 1.6, 16),
        matCaster
      );
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(cx, 0.7, cz);
      rack.add(wheel);
    });

    const postH = INNER_H + TOP_H;
    const postY = BASE_H + postH / 2;
    const px = OUTER_W / 2 - FRAME_T / 2;
    const pz = OUTER_D / 2 - FRAME_T / 2;
    [[-px, -pz], [px, -pz], [-px, pz], [px, pz]].forEach(([x, z]) => {
      rack.add(box(FRAME_T, postH, FRAME_T, matFrame, x, postY, z));
    });

    const sideH = INNER_H - 1;
    const sideY = BASE_H + INNER_H / 2;
    rack.add(box(0.8, sideH, OUTER_D - FRAME_T * 2 - 2, matPanel, -OUTER_W / 2 + 0.6, sideY, 0));
    rack.add(box(0.8, sideH, OUTER_D - FRAME_T * 2 - 2, matPanel, OUTER_W / 2 - 0.6, sideY, 0));
    rack.add(box(OUTER_W - FRAME_T * 2 - 1, sideH, 0.7, matPanel, 0, sideY, OUTER_D / 2 - 0.8));
    rack.add(rounded(OUTER_W + 1, TOP_H, OUTER_D + 1, 0.3, matFrame, 0, BASE_H + INNER_H + TOP_H / 2, 0));

    const railInsetX = RAIL_WIDTH / 2;
    const railDepth = 2.4;
    const railZFront = -OUTER_D / 2 + 8;
    const railZRear = OUTER_D / 2 - 14;
    [-railInsetX, railInsetX].forEach((x) => {
      rack.add(box(1.6, INNER_H, railDepth, matRail, x, sideY, railZFront));
      rack.add(box(1.6, INNER_H, railDepth, matRail, x, sideY, railZRear));
    });

    const holeGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.35, 8);
    const holeMat = new THREE.MeshStandardMaterial({ color: 0x6a7380, metalness: 0.2, roughness: 0.8 });
    for (let u = 0; u < UNITS; u++) {
      const yBase = BASE_H + u * U;
      for (let n = 0; n < 3; n++) {
        const hy = yBase + 0.63 + n * 1.59;
        [-railInsetX, railInsetX].forEach((x) => {
          const hole = new THREE.Mesh(holeGeo, holeMat);
          hole.rotation.z = Math.PI / 2;
          hole.position.set(x + (x > 0 ? -0.85 : 0.85), hy, railZFront);
          rack.add(hole);
        });
      }
    }

    const layout = [
      [0, 1, "blank"],
      [1, 1, "pdu"],
      [2, 2, "server"],
      [4, 2, "server"],
      [6, 1, "switch"],
      [7, 1, "blank"],
      [8, 1, "server1"],
      [9, 1, "server1"],
      [10, 1, "server1"],
      [11, 1, "blank"],
      [12, 2, "server"],
      [14, 1, "switch"],
      [15, 1, "blank"],
      [16, 1, "server1"],
      [17, 1, "server1"],
      [18, 2, "storage"],
      [20, 1, "blank"],
      [21, 1, "switch"],
      [22, 2, "server"],
      [24, 1, "server1"],
      [25, 1, "server1"],
      [26, 1, "blank"],
      [27, 1, "pdu"],
      [28, 2, "server"],
      [30, 1, "switch"],
      [31, 1, "blank"],
      [32, 1, "server1"],
      [33, 1, "server1"],
      [34, 2, "storage"],
      [36, 1, "blank"],
      [37, 1, "server1"],
      [38, 2, "server"],
      [40, 1, "switch"],
      [41, 1, "blank"],
    ];

    const leds = [];
    const equipDepth = 72;
    const equipZ = railZFront + equipDepth / 2 + 1.2;
    const faceW = RAIL_WIDTH - 1.2;

    function addLeds(group, count, y, z, spacing = 1.1) {
      const startX = -((count - 1) * spacing) / 2;
      for (let i = 0; i < count; i++) {
        const on = Math.random() > 0.18;
        const amber = on && Math.random() > 0.82;
        const mat = !on ? matLedDim : amber ? matLedAmber : matLedOn;
        const led = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.2), mat);
        led.position.set(startX + i * spacing, y, z);
        group.add(led);
        if (on) leds.push({ mesh: led, phase: Math.random() * Math.PI * 2, amber });
      }
    }

    function makeBezel(h, type) {
      const g = new THREE.Group();
      g.add(box(faceW, h - 0.25, equipDepth, matServer, 0, 0, 0));
      g.add(box(faceW - 0.2, h - 0.45, 0.5, matFace, 0, 0, -equipDepth / 2 - 0.15));

      if (type === "blank") {
        g.children[0].material = matBlank;
        g.children[1].material = matBlank;
        g.add(box(faceW * 0.55, 0.35, 0.2, matAccent, 0, 0, -equipDepth / 2 - 0.4));
        return g;
      }

      if (type === "pdu") {
        g.add(box(faceW * 0.92, h * 0.35, 0.25, matAccent, 0, 0, -equipDepth / 2 - 0.4));
        addLeds(g, 6, 0, -equipDepth / 2 - 0.55, 1.4);
        return g;
      }

      if (type === "switch") {
        for (let row = 0; row < 2; row++) {
          for (let p = 0; p < 12; p++) {
            g.add(box(
              0.9, 0.7, 0.35, matAccent,
              -faceW / 2 + 3.5 + p * 2.9,
              (row === 0 ? 0.55 : -0.55) * Math.min(1, h / U),
              -equipDepth / 2 - 0.4
            ));
          }
        }
        addLeds(g, 4, h * 0.28, -equipDepth / 2 - 0.55, 1.0);
        return g;
      }

      if (type === "storage") {
        for (let i = 0; i < 8; i++) {
          g.add(box(
            4.2, h * 0.62, 0.4, matAccent,
            -faceW / 2 + 5 + i * 5.2, 0, -equipDepth / 2 - 0.4
          ));
        }
        addLeds(g, 3, h * 0.3, -equipDepth / 2 - 0.55);
        return g;
      }

      const bays = type === "server1" ? 4 : 8;
      const bayW = (faceW - 8) / bays - 0.4;
      for (let i = 0; i < bays; i++) {
        const bx = -faceW / 2 + 4 + i * (bayW + 0.4) + bayW / 2;
        g.add(box(bayW, h * 0.55, 0.35, matAccent, bx, 0.1, -equipDepth / 2 - 0.4));
        for (let s = 0; s < 3; s++) {
          g.add(box(bayW * 0.7, 0.12, 0.15, matFace, bx, -h * 0.12 + s * 0.35, -equipDepth / 2 - 0.6));
        }
      }
      g.add(box(1.2, h * 0.7, 0.6, matRail, -faceW / 2 + 1.2, 0, -equipDepth / 2 - 0.5));
      g.add(box(1.2, h * 0.7, 0.6, matRail, faceW / 2 - 1.2, 0, -equipDepth / 2 - 0.5));
      addLeds(g, type === "server1" ? 2 : 3, h * 0.28, -equipDepth / 2 - 0.55);
      return g;
    }

    layout.forEach(([startU, heightU, type]) => {
      const h = heightU * U - 0.15;
      const y = BASE_H + startU * U + h / 2 + 0.05;
      const unit = makeBezel(h, type);
      unit.position.set(0, y, equipZ);
      rack.add(unit);
    });

    const door = new THREE.Group();
    const doorW = OUTER_W - 4;
    const doorH = INNER_H - 2;
    door.add(box(doorW, doorH, 0.6, matPanel, doorW / 2, 0, 0));
    const punchGeo = new THREE.CircleGeometry(0.55, 8);
    const punchMat = new THREE.MeshBasicMaterial({ color: 0xa8b4c2 });
    for (let row = -14; row <= 14; row++) {
      for (let col = -6; col <= 6; col++) {
        if ((row + col) % 2 !== 0) continue;
        const punch = new THREE.Mesh(punchGeo, punchMat);
        punch.position.set(doorW / 2 + col * 2.8, row * 4.2, -0.35);
        door.add(punch);
      }
    }
    door.position.set(-OUTER_W / 2 + 1.5, sideY, -OUTER_D / 2 + 1);
    door.rotation.y = -Math.PI * 0.42;
    rack.add(door);

    for (let u = 0; u <= UNITS; u += 5) {
      rack.add(box(0.5, 0.2, 0.5, matAccent, -railInsetX - 1.4, BASE_H + u * U, railZFront));
    }

    // Daylight studio lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.72));

    const key = new THREE.DirectionalLight(0xfff6ea, 1.55);
    key.position.set(70, 160, -50);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 10;
    key.shadow.camera.far = 360;
    key.shadow.camera.left = -100;
    key.shadow.camera.right = 100;
    key.shadow.camera.top = 140;
    key.shadow.camera.bottom = -30;
    key.shadow.bias = -0.0002;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xb9d4ef, 0.85);
    fill.position.set(-90, 70, 60);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.45);
    rim.position.set(10, 50, 120);
    scene.add(rim);

    const bounce = new THREE.PointLight(0xffffff, 40, 160, 2);
    bounce.position.set(0, 12, -30);
    scene.add(bounce);

    // Fit entire rack in view — critical for tall portrait phones
    const framingBox = new THREE.Box3();
    function frameRack(forceReset = true) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const mobile = isMobile();

      camera.fov = mobile ? 52 : 40;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      framingBox.setFromObject(rack);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      framingBox.getSize(size);
      framingBox.getCenter(center);

      // Extra vertical margin for HUD chrome on phones
      const padX = mobile ? 1.35 : 1.2;
      const padY = mobile ? 1.55 : 1.25;

      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distY = (size.y * padY * 0.5) / Math.tan(vFov / 2);
      const distX = (size.x * padX * 0.5) / Math.tan(hFov / 2);
      // Depth also matters with the open door
      const distZ = (size.z * padX * 0.5) / Math.tan(hFov / 2);
      const distance = Math.max(distX, distY, distZ) * (mobile ? 1.12 : 1.05);

      controls.target.copy(center);
      // Slightly raise target on desktop; on mobile center true mid-rack
      if (mobile) controls.target.y = center.y * 0.98;

      controls.minDistance = Math.max(30, distance * 0.35);
      controls.maxDistance = Math.max(900, distance * 3.5);

      if (forceReset) {
        // 3/4 view from front-right, high enough to read full height
        const dir = new THREE.Vector3(0.55, mobile ? 0.12 : 0.18, 0.82).normalize();
        camera.position.copy(center).addScaledVector(dir, distance);
        controls.update();
      }
    }

    frameRack(true);

    const clock = new THREE.Clock();

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      frameRack(true);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => setTimeout(() => frameRack(true), 200));

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      leds.forEach(({ mesh, phase, amber }) => {
        const pulse = 0.85 + Math.sin(t * 2.2 + phase) * 0.3;
        mesh.material.emissiveIntensity = amber ? 0.85 * pulse : 1.05 * pulse;
      });

      ring.material.opacity = 0.22 + Math.sin(t * 0.7) * 0.06;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
