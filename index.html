<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Rack1–6 — Austin Hughes UltraRack 42U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12151a;
      --steel: #5c6674;
      --mist: #f4f7fb;
      --signal: #1f9d62;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--mist);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background:
        radial-gradient(ellipse 90% 60% at 50% 12%, #ffffff 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 85%, #d9e6f2 0%, transparent 50%),
        linear-gradient(165deg, #eef3f8 0%, #e2eaf2 48%, #d7e2ec 100%);
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      padding: clamp(1rem, 3vw, 2.5rem);
      padding-top: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-top));
      padding-bottom: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .brand { justify-self: start; animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .brand .maker {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--steel);
      margin-bottom: 0.35rem;
    }

    .brand h1 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(2.2rem, 8vw, 5.5rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--ink);
      text-transform: uppercase;
    }

    .brand p {
      margin-top: 0.65rem;
      max-width: 36ch;
      font-size: 0.76rem;
      line-height: 1.55;
      color: var(--steel);
    }

    .meta {
      align-self: end;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.75rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--steel);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    .meta span { display: inline-flex; align-items: center; gap: 0.55rem; }

    .meta i {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 8px color-mix(in srgb, var(--signal) 55%, transparent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .hint {
      position: fixed;
      right: clamp(1rem, 3vw, 2.5rem);
      top: max(clamp(1rem, 3vw, 2.5rem), env(safe-area-inset-top));
      z-index: 2;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--steel) 80%, transparent);
      pointer-events: none;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    .door-controls {
      position: fixed;
      left: 50%;
      bottom: max(clamp(1rem, 3vw, 2.25rem), env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      pointer-events: auto;
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
    }

    .door-controls button {
      appearance: none;
      border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
      background: color-mix(in srgb, #ffffff 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.85rem 1.1rem;
      min-width: 9.5rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .door-controls button:hover {
      background: #fff;
      border-color: color-mix(in srgb, var(--ink) 28%, transparent);
    }

    .door-controls button:active { transform: scale(0.98); }

    .door-controls button.open {
      background: var(--ink);
      color: #f4f7fb;
      border-color: var(--ink);
    }

    .door-controls button .label {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      opacity: 0.55;
      margin-bottom: 0.2rem;
    }

    .door-controls button.open .label {
      opacity: 0.7;
      color: #c5ccd6;
    }

    .door-controls button .action {
      display: block;
      font-weight: 500;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @media (max-width: 640px) {
      .brand h1 { font-size: clamp(1.8rem, 11vw, 2.8rem); }
      .brand p { max-width: 32ch; font-size: 0.7rem; }
      .meta { display: none; }
      .hint { display: none; }
      .door-controls {
        left: clamp(0.75rem, 3vw, 1.5rem);
        right: clamp(0.75rem, 3vw, 1.5rem);
        transform: none;
        width: auto;
      }
      .door-controls button {
        flex: 1 1 calc(50% - 0.3rem);
        min-width: 0;
        padding: 0.75rem 0.7rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Austin Hughes UltraRack Rack1 through Rack6 face to face"></canvas>

  <div class="hud">
    <header class="brand">
      <div class="maker">Austin Hughes</div>
      <h1>Rack1–6</h1>
      <p>UltraRack SR 800W · 42U · 1072D · raised floor · face-to-face rows.</p>
    </header>
    <div></div>
    <footer class="meta">
      <span><i></i> Live render</span>
      <span>800W · 1072D</span>
      <span>19″ rails · 42U</span>
    </footer>
  </div>
  <div class="hint">Orbit · Zoom · Pan</div>
  <div class="door-controls" role="group" aria-label="Door controls">
    <button type="button" id="btn-front" aria-pressed="true">
      <span class="label">Front doors</span>
      <span class="action">Close</span>
    </button>
    <button type="button" id="btn-rear" aria-pressed="true">
      <span class="label">Rear doors</span>
      <span class="action">Close</span>
    </button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    // Proportions ≈ Austin Hughes SR-8042 (800W × 1072D × 42U), cm
    const U = 4.445;
    const UNITS = 42;
    const RAIL_WIDTH = 48.26;
    const OUTER_W = 80;
    const OUTER_D = 107.2;
    const FRAME_T = 2.4;
    const INNER_H = UNITS * U;
    const BASE_H = 7;
    const TOP_H = 5;
    const TOTAL_H = BASE_H + INNER_H + TOP_H;
    const RACK_PITCH = OUTER_W + 12;

    const FRONT_CLOSED = 0;
    const FRONT_OPEN = 1.35;
    const REAR_L_CLOSED = 0;
    const REAR_L_OPEN = -1.35;
    const REAR_R_CLOSED = 0;
    const REAR_R_OPEN = 1.35;

    const canvas = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xe8eef4, 420, 1100);

    const isMobile = () => window.matchMedia("(max-width: 640px), (pointer: coarse)").matches;
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 3000);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 40;
    controls.maxDistance = 1400;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minPolarAngle = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enablePan = true;
    controls.screenSpacePanning = true;

    let idleTimer;
    controls.addEventListener("start", () => {
      controls.autoRotate = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { controls.autoRotate = true; }, 4500);
    });

    // Distinct finishes so frame / doors / rails / gear don't read as one black mass
    const matFrame = new THREE.MeshStandardMaterial({ color: 0x14171c, metalness: 0.75, roughness: 0.28 });
    const matDoor = new THREE.MeshStandardMaterial({ color: 0x2a313a, metalness: 0.6, roughness: 0.36 });
    const matRail = new THREE.MeshStandardMaterial({ color: 0xc5ced8, metalness: 0.85, roughness: 0.28 });
    const matPanel = new THREE.MeshStandardMaterial({ color: 0x4a5562, metalness: 0.35, roughness: 0.55 });
    const matAccent = new THREE.MeshStandardMaterial({ color: 0x6b7785, metalness: 0.45, roughness: 0.42 });
    const matInterior = new THREE.MeshStandardMaterial({ color: 0x9aa5b1, metalness: 0.15, roughness: 0.75 });
    const matCaster = new THREE.MeshStandardMaterial({ color: 0x3a4048, metalness: 0.4, roughness: 0.6 });
    const matChrome = new THREE.MeshStandardMaterial({ color: 0xd7dde4, metalness: 0.95, roughness: 0.18 });
    const matHandle = new THREE.MeshStandardMaterial({ color: 0xe8a54b, metalness: 0.7, roughness: 0.32 });
    // UPS — cooler charcoal + lighter face so it separates from the rack shell
    const matUps = new THREE.MeshStandardMaterial({ color: 0x2b3340, metalness: 0.4, roughness: 0.5 });
    const matUpsFace = new THREE.MeshStandardMaterial({ color: 0x5c6a7a, metalness: 0.3, roughness: 0.48 });
    const matUpsLcd = new THREE.MeshStandardMaterial({
      color: 0x1a3a2a, emissive: 0x2dcc70, emissiveIntensity: 0.9, metalness: 0.2, roughness: 0.35,
    });
    const matUpsLed = new THREE.MeshStandardMaterial({
      color: 0x3dd68c, emissive: 0x3dd68c, emissiveIntensity: 1.6, metalness: 0.2, roughness: 0.35,
    });
    const matUpsBadge = new THREE.MeshStandardMaterial({ color: 0xfff7e8, metalness: 0.08, roughness: 0.4 });
    const matUpsVent = new THREE.MeshStandardMaterial({ color: 0x1e2530, metalness: 0.5, roughness: 0.45 });
    const matSubfloor = new THREE.MeshStandardMaterial({ color: 0xb8c0c8, metalness: 0.05, roughness: 0.96 });
    const matFloorTile = new THREE.MeshStandardMaterial({ color: 0xd8dee6, metalness: 0.18, roughness: 0.72 });
    const matFloorTileAlt = new THREE.MeshStandardMaterial({ color: 0xcfd6df, metalness: 0.18, roughness: 0.74 });
    const matFloorEdge = new THREE.MeshStandardMaterial({ color: 0x8a949e, metalness: 0.4, roughness: 0.55 });
    const matPedestal = new THREE.MeshStandardMaterial({ color: 0x6a737c, metalness: 0.55, roughness: 0.45 });

    // Honeycomb door: steel mesh color + punched holes (alpha) so pattern stays readable
    function makeHexDoorMaps(w = 512, h = 1024, hexR = 8) {
      const alpha = document.createElement("canvas");
      const color = document.createElement("canvas");
      alpha.width = color.width = w;
      alpha.height = color.height = h;
      const actx = alpha.getContext("2d");
      const cctx = color.getContext("2d");
      // Opaque steel field
      actx.fillStyle = "#fff";
      actx.fillRect(0, 0, w, h);
      cctx.fillStyle = "#7a8794";
      cctx.fillRect(0, 0, w, h);
      const dx = hexR * Math.sqrt(3);
      const dy = hexR * 1.5;
      for (let row = 0, y = hexR; y < h + hexR; row++, y += dy) {
        const xOff = (row % 2) * (dx * 0.5);
        for (let x = hexR + xOff; x < w + hexR; x += dx) {
          // Alpha punch
          actx.fillStyle = "#000";
          actx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = Math.PI / 6 + (i * Math.PI) / 3;
            const px = x + hexR * 0.86 * Math.cos(ang);
            const py = y + hexR * 0.86 * Math.sin(ang);
            if (i === 0) actx.moveTo(px, py);
            else actx.lineTo(px, py);
          }
          actx.closePath();
          actx.fill();
          // Dark hole ring on color map for edge definition
          cctx.fillStyle = "#3a4450";
          cctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = Math.PI / 6 + (i * Math.PI) / 3;
            const px = x + hexR * 0.95 * Math.cos(ang);
            const py = y + hexR * 0.95 * Math.sin(ang);
            if (i === 0) cctx.moveTo(px, py);
            else cctx.lineTo(px, py);
          }
          cctx.closePath();
          cctx.fill();
        }
      }
      const border = Math.max(14, Math.round(w * 0.045));
      actx.fillStyle = "#fff";
      actx.fillRect(0, 0, w, border);
      actx.fillRect(0, h - border, w, border);
      actx.fillRect(0, 0, border, h);
      actx.fillRect(w - border, 0, border, h);
      cctx.fillStyle = "#5c6772";
      cctx.fillRect(0, 0, w, border);
      cctx.fillRect(0, h - border, w, border);
      cctx.fillRect(0, 0, border, h);
      cctx.fillRect(w - border, 0, border, h);
      const alphaTex = new THREE.CanvasTexture(alpha);
      alphaTex.colorSpace = THREE.NoColorSpace;
      alphaTex.anisotropy = 8;
      const colorTex = new THREE.CanvasTexture(color);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = 8;
      return { alphaTex, colorTex };
    }

    const doorMaps = makeHexDoorMaps();
    const matPerf = new THREE.MeshStandardMaterial({
      map: doorMaps.colorTex,
      alphaMap: doorMaps.alphaTex,
      metalness: 0.7,
      roughness: 0.32,
      transparent: true,
      alphaTest: 0.4,
      side: THREE.DoubleSide,
      depthWrite: true,
    });

    function box(w, h, d, mat, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function rounded(w, h, d, r, mat, x, y, z) {
      const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeSwingHandle(length = 14) {
      const g = new THREE.Group();
      g.add(box(3.2, length + 2, 0.6, matHandle, 0, 0, 0));
      g.add(box(1.6, length * 0.55, 1.4, matChrome, 0.2, length * 0.08, 0.9));
      const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.8, 16), matChrome);
      knob.rotation.x = Math.PI / 2;
      knob.position.set(0.2, -length * 0.22, 0.9);
      knob.castShadow = true;
      g.add(knob);
      return g;
    }

    function makePerforatedDoorLeaf(width, height) {
      const g = new THREE.Group();
      const t = 1.4;
      g.add(box(width, t, 1.0, matDoor, 0, height / 2 - t / 2, 0));
      g.add(box(width, t, 1.0, matDoor, 0, -height / 2 + t / 2, 0));
      g.add(box(t, height - t * 2, 1.0, matDoor, -width / 2 + t / 2, 0, 0));
      g.add(box(t, height - t * 2, 1.0, matDoor, width / 2 - t / 2, 0, 0));
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(width - t * 1.6, height - t * 1.6), matPerf);
      panel.position.z = 0.05;
      panel.castShadow = true;
      panel.receiveShadow = true;
      g.add(panel);
      const back = new THREE.Mesh(new THREE.PlaneGeometry(width - t * 1.6, height - t * 1.6), matPerf);
      back.rotation.y = Math.PI;
      back.position.z = -0.05;
      g.add(back);
      return g;
    }

    function makeBrotherLabel(text, widthCm, depthCm) {
      const pw = 1024;
      const ph = 320;
      const c = document.createElement("canvas");
      c.width = pw;
      c.height = ph;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff8e8";
      ctx.fillRect(0, 0, pw, ph);
      const sheen = ctx.createLinearGradient(0, 0, 0, ph);
      sheen.addColorStop(0, "rgba(255,255,255,0.55)");
      sheen.addColorStop(0.4, "rgba(255,255,255,0)");
      sheen.addColorStop(1, "rgba(0,0,0,0.07)");
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, pw, ph);
      ctx.strokeStyle = "rgba(20,24,30,0.22)";
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, pw - 10, ph - 10);
      ctx.fillStyle = "#0a0c10";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `800 ${Math.floor(ph * 0.7)}px "Archivo Black", "Arial Black", sans-serif`;
      ctx.fillText(text, pw / 2, ph / 2 + 4);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.32,
        metalness: 0.04,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -1,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthCm, depthCm), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = Math.PI;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const holeGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 8);
    const holeMat = new THREE.MeshStandardMaterial({ color: 0x050506, metalness: 0.2, roughness: 0.85 });

    /** Front-panel artwork matching APC Smart-UPS On-Line SRTG15/20 rack face */
    function makeApcSrtgFrontTexture() {
      const pw = 1408; // ~440mm aspect
      const ph = 976;  // ~306mm
      const c = document.createElement("canvas");
      c.width = pw;
      c.height = ph;
      const ctx = c.getContext("2d");

      // Chassis bezel
      ctx.fillStyle = "#1a1d22";
      ctx.fillRect(0, 0, pw, ph);
      const edge = ctx.createLinearGradient(0, 0, 0, ph);
      edge.addColorStop(0, "rgba(255,255,255,0.08)");
      edge.addColorStop(0.5, "rgba(0,0,0,0)");
      edge.addColorStop(1, "rgba(0,0,0,0.35)");
      ctx.fillStyle = edge;
      ctx.fillRect(0, 0, pw, ph);

      const inset = 36;
      const midX = pw * 0.48;
      const panelL = { x: inset, y: inset, w: midX - inset - 10, h: ph - inset * 2 };
      const panelR = { x: midX + 10, y: inset, w: pw - inset - (midX + 10), h: ph - inset * 2 };

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function fillHexMesh(x, y, w, h) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        // Base mesh field
        const g = ctx.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, "#2a3038");
        g.addColorStop(1, "#1c2128");
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        // Large triangular under-structure
        ctx.strokeStyle = "rgba(55,62,72,0.85)";
        ctx.lineWidth = 3;
        const tri = 70;
        for (let ty = y - tri; ty < y + h + tri; ty += tri) {
          for (let tx = x - tri; tx < x + w + tri; tx += tri) {
            ctx.beginPath();
            ctx.moveTo(tx, ty + tri);
            ctx.lineTo(tx + tri / 2, ty);
            ctx.lineTo(tx + tri, ty + tri);
            ctx.closePath();
            ctx.stroke();
          }
        }

        // Fine honeycomb
        const R = 7;
        const dx = R * Math.sqrt(3);
        const dy = R * 1.5;
        ctx.strokeStyle = "rgba(140,150,162,0.55)";
        ctx.lineWidth = 1.1;
        ctx.fillStyle = "rgba(10,12,16,0.55)";
        for (let row = 0, yy = y + R; yy < y + h; row++, yy += dy) {
          const xOff = (row % 2) * (dx * 0.5);
          for (let xx = x + R + xOff; xx < x + w; xx += dx) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = Math.PI / 6 + (i * Math.PI) / 3;
              const px2 = xx + R * 0.82 * Math.cos(a);
              const py2 = yy + R * 0.82 * Math.sin(a);
              if (i === 0) ctx.moveTo(px2, py2);
              else ctx.lineTo(px2, py2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }

        // Faint fan discs behind mesh (left panel)
        if (w < pw * 0.5) {
          ctx.fillStyle = "rgba(40,48,58,0.35)";
          [[0.35, 0.62], [0.68, 0.78]].forEach(([fx, fy]) => {
            ctx.beginPath();
            ctx.arc(x + w * fx, y + h * fy, Math.min(w, h) * 0.16, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();
      }

      // Dual front doors / modules
      [[panelL, true], [panelR, false]].forEach(([p, isLeft], idx) => {
        roundRect(p.x, p.y, p.w, p.h, 14);
        ctx.fillStyle = "#14181e";
        ctx.fill();
        ctx.strokeStyle = "rgba(90,100,112,0.65)";
        ctx.lineWidth = 3;
        ctx.stroke();
        fillHexMesh(p.x + 8, p.y + 8, p.w - 16, p.h - 16);

        // Outer lip highlight
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;
        roundRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4, 12);
        ctx.stroke();
      });

      // --- Control cluster (left module, upper) ---
      const ctrlW = panelL.w * 0.72;
      const ctrlH = panelL.h * 0.38;
      const ctrlX = panelL.x + (panelL.w - ctrlW) / 2;
      const ctrlY = panelL.y + panelL.h * 0.08;
      roundRect(ctrlX, ctrlY, ctrlW, ctrlH, 10);
      ctx.fillStyle = "#0c0e12";
      ctx.fill();
      ctx.strokeStyle = "rgba(180,190,200,0.35)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Smart-UPS title
      ctx.fillStyle = "#f2f4f7";
      ctx.font = "600 28px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Smart-UPS", ctrlX + ctrlW / 2, ctrlY + 28);

      // Status LED icons row
      const leds = [
        { label: "~", on: true },
        { label: "💡", on: true },
        { label: "!", on: false },
        { label: "⏻", on: true },
      ];
      const ledY = ctrlY + 58;
      leds.forEach((led, i) => {
        const lx = ctrlX + ctrlW * 0.22 + i * (ctrlW * 0.18);
        ctx.beginPath();
        ctx.arc(lx, ledY, 7, 0, Math.PI * 2);
        if (led.on) {
          ctx.fillStyle = i === 2 ? "#e8a54b" : "#3dd68c";
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = "#3a4048";
          ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // LCD
      const lcdW = ctrlW * 0.82;
      const lcdH = ctrlH * 0.42;
      const lcdX = ctrlX + (ctrlW - lcdW) / 2;
      const lcdY = ctrlY + 78;
      roundRect(lcdX, lcdY, lcdW, lcdH, 6);
      const lcdGrad = ctx.createLinearGradient(lcdX, lcdY, lcdX, lcdY + lcdH);
      lcdGrad.addColorStop(0, "#1a2220");
      lcdGrad.addColorStop(1, "#0a100e");
      ctx.fillStyle = lcdGrad;
      ctx.fill();
      ctx.strokeStyle = "#4a5560";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#d8e6dc";
      ctx.font = "700 22px 'IBM Plex Mono', monospace";
      ctx.fillText("- ONLINE -", lcdX + lcdW / 2, lcdY + 28);
      ctx.font = "600 16px 'IBM Plex Mono', monospace";
      ctx.textAlign = "left";
      ctx.fillText("OUTPUT 230V", lcdX + 18, lcdY + 58);
      ctx.textAlign = "right";
      ctx.fillText("OUTPUT 50.0Hz", lcdX + lcdW - 18, lcdY + 58);

      // Load / battery bars
      ctx.textAlign = "left";
      ctx.font = "500 13px 'IBM Plex Mono', monospace";
      ctx.fillStyle = "#9aa8a0";
      ctx.fillText("LOAD", lcdX + 18, lcdY + 82);
      ctx.fillText("BATTERY", lcdX + lcdW * 0.52, lcdY + 82);
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i < 2 ? "#3dd68c" : "#2a3530";
        ctx.fillRect(lcdX + 18 + i * 14, lcdY + 92, 11, 10);
        ctx.fillStyle = i < 4 ? "#3dd68c" : "#2a3530";
        ctx.fillRect(lcdX + lcdW * 0.52 + i * 14, lcdY + 92, 11, 10);
      }

      // Soft keys
      const keys = ["ESC", "▲", "▼", "OK"];
      keys.forEach((k, i) => {
        const kx = ctrlX + ctrlW * 0.18 + i * (ctrlW * 0.2);
        const ky = ctrlY + ctrlH - 36;
        roundRect(kx - 22, ky - 14, 44, 28, 5);
        ctx.fillStyle = "#3a424c";
        ctx.fill();
        ctx.strokeStyle = "#8a949e";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#e8eef4";
        ctx.font = "600 12px 'IBM Plex Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(k, kx, ky + 1);
      });

      // APC logo — bottom of left panel
      ctx.save();
      ctx.fillStyle = "#f5f7fa";
      ctx.font = "800 34px 'Archivo Black', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("APC", panelL.x + 28, panelL.y + panelL.h - 52);
      ctx.font = "500 14px 'IBM Plex Mono', monospace";
      ctx.fillStyle = "#c5ccd6";
      ctx.fillText("by Schneider Electric", panelL.x + 28, panelL.y + panelL.h - 28);
      ctx.restore();

      // Battery module icon — right panel
      const bx = panelR.x + panelR.w * 0.18;
      const by = panelR.y + panelR.h * 0.72;
      ctx.strokeStyle = "#f2f4f7";
      ctx.fillStyle = "rgba(242,244,247,0.08)";
      ctx.lineWidth = 4;
      roundRect(bx, by, 70, 90, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#f2f4f7";
      ctx.fillRect(bx + 22, by - 10, 26, 12);
      ctx.font = "700 28px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText("+", bx + 35, by + 38);
      ctx.fillText("−", bx + 35, by + 72);

      // Model callout
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "500 13px 'IBM Plex Mono', monospace";
      ctx.textAlign = "right";
      ctx.fillText("SRTG15KXLI  15kVA / 15kW", pw - inset - 8, ph - 14);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    /** APC Smart-UPS On-Line SRTG15KXLI — 15kVA/15kW, 7U, 440×700×306 mm */
    function makeApcSrtg15() {
      const heightU = 7;
      const h = heightU * U - 0.2;
      const w = 44;   // 440 mm EIA width
      const d = 70;   // 700 mm depth
      const g = new THREE.Group();

      g.add(box(w, h, d, matUps, 0, 0, 0));

      // Slightly proud front bezel
      g.add(box(w + 0.6, h + 0.4, 1.2, matUpsFace, 0, 0, -d / 2 - 0.1));

      // Product front face texture
      const frontMat = new THREE.MeshStandardMaterial({
        map: makeApcSrtgFrontTexture(),
        metalness: 0.25,
        roughness: 0.48,
      });
      const face = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.2, h - 0.3), frontMat);
      face.position.set(0, 0, -d / 2 - 0.75);
      face.castShadow = true;
      g.add(face);

      // Rack ears
      g.add(box(1.6, h * 0.92, 1.4, matChrome, -w / 2 - 0.2, 0, -d / 2 - 0.15));
      g.add(box(1.6, h * 0.92, 1.4, matChrome, w / 2 + 0.2, 0, -d / 2 - 0.15));

      // Rear terminal / fan hint
      g.add(box(w * 0.85, h * 0.7, 0.5, matUpsVent, 0, 0, d / 2 + 0.2));
      for (let i = 0; i < 4; i++) {
        const fan = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 0.35, 16), matAccent);
        fan.rotation.x = Math.PI / 2;
        fan.position.set(-12 + i * 8, h * 0.15, d / 2 + 0.45);
        g.add(fan);
      }

      g.userData.heightU = heightU;
      return g;
    }

    function createRack(name, extraLabels = [], equipment = []) {
      const rack = new THREE.Group();
      rack.name = name;

      rack.add(rounded(OUTER_W + 1.5, BASE_H, OUTER_D + 1.5, 0.35, matFrame, 0, BASE_H / 2, 0));
      [[-32, -42], [32, -42], [-32, 42], [32, 42]].forEach(([cx, cz]) => {
        rack.add(box(4.5, 2.2, 4.5, matCaster, cx, 1.1, cz));
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 1.5, 16), matCaster);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(cx, 0.65, cz);
        rack.add(wheel);
        const foot = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 2.2, 12), matChrome);
        foot.position.set(cx + (cx > 0 ? -5 : 5), 1.1, cz + (cz > 0 ? -5 : 5));
        rack.add(foot);
      });

      const postH = INNER_H + TOP_H;
      const postY = BASE_H + postH / 2;
      const px = OUTER_W / 2 - FRAME_T / 2;
      const pz = OUTER_D / 2 - FRAME_T / 2;
      [[-px, -pz], [px, -pz], [-px, pz], [px, pz]].forEach(([x, z]) => {
        rack.add(box(FRAME_T, postH, FRAME_T, matFrame, x, postY, z));
      });

      const sideH = INNER_H - 1;
      const sideY = BASE_H + INNER_H / 2;
      const sideD = (OUTER_D - FRAME_T * 2 - 3) / 2;
      [-1, 1].forEach((side) => {
        const x = side * (OUTER_W / 2 - 0.55);
        rack.add(box(0.7, sideH * 0.49, sideD - 0.4, matPanel, x, sideY + sideH * 0.255, -sideD / 2 - 0.2));
        rack.add(box(0.7, sideH * 0.49, sideD - 0.4, matPanel, x, sideY - sideH * 0.255, -sideD / 2 - 0.2));
        rack.add(box(0.7, sideH * 0.49, sideD - 0.4, matPanel, x, sideY + sideH * 0.255, sideD / 2 + 0.2));
        rack.add(box(0.7, sideH * 0.49, sideD - 0.4, matPanel, x, sideY - sideH * 0.255, sideD / 2 + 0.2));
      });

      rack.add(rounded(OUTER_W + 0.8, TOP_H, OUTER_D + 0.8, 0.25, matFrame, 0, BASE_H + INNER_H + TOP_H / 2, 0));
      rack.add(box(OUTER_W * 0.55, 0.4, OUTER_D * 0.35, matAccent, 0, BASE_H + INNER_H + TOP_H - 0.5, 0));

      const railInsetX = RAIL_WIDTH / 2;
      const railZFront = -OUTER_D / 2 + 10;
      const railZRear = OUTER_D / 2 - 12;
      [-railInsetX, railInsetX].forEach((x) => {
        rack.add(box(1.5, INNER_H, 2.2, matRail, x, sideY, railZFront));
        rack.add(box(1.5, INNER_H, 2.2, matRail, x, sideY, railZRear));
      });

      // Light interior backplane — makes door perforations and gear read clearly
      rack.add(box(
        OUTER_W - FRAME_T * 2 - 2,
        INNER_H - 2,
        0.5,
        matInterior,
        0,
        sideY,
        OUTER_D / 2 - 8
      ));

      for (let u = 0; u < UNITS; u++) {
        const yBase = BASE_H + u * U;
        for (let n = 0; n < 3; n++) {
          const hy = yBase + 0.63 + n * 1.59;
          [-railInsetX, railInsetX].forEach((x) => {
            const hole = new THREE.Mesh(holeGeo, holeMat);
            hole.rotation.z = Math.PI / 2;
            hole.position.set(x + (x > 0 ? -0.8 : 0.8), hy, railZFront);
            rack.add(hole);
          });
        }
        if (u % 5 === 0) {
          rack.add(box(0.45, 0.18, 0.45, matChrome, -railInsetX - 1.3, yBase, railZFront));
        }
      }

      // Brother labels on top — name, width, depth
      const labelY = BASE_H + INNER_H + TOP_H + 0.12;
      const labelW = 56;
      const labelD = 11;
      const labelGap = 1.2;
      [`${name}`, "800W", "1072D", ...extraLabels].forEach((text, i) => {
        const tag = makeBrotherLabel(text, labelW, labelD);
        tag.position.set(0, labelY, -OUTER_D / 2 + 7 + i * (labelD + labelGap));
        rack.add(tag);
      });

      // Mounted equipment (bottom-up U positions)
      const equipZ = railZFront + 35 + 1.0;
      equipment.forEach(({ type, startU }) => {
        let unit = null;
        if (type === "ups-srtg15") unit = makeApcSrtg15();
        if (!unit) return;
        const heightU = unit.userData.heightU || 1;
        const h = heightU * U - 0.2;
        const y = BASE_H + startU * U + h / 2 + 0.05;
        unit.position.set(0, y, equipZ);
        rack.add(unit);
      });

      const doorW = OUTER_W - 3.2;
      const doorH = INNER_H - 1.5;

      const frontDoor = new THREE.Group();
      const frontLeaf = makePerforatedDoorLeaf(doorW, doorH);
      frontLeaf.position.x = doorW / 2;
      frontDoor.add(frontLeaf);
      const frontHandle = makeSwingHandle(16);
      frontHandle.position.set(doorW - 3.2, 0, 0.9);
      frontDoor.add(frontHandle);
      frontDoor.position.set(-OUTER_W / 2 + 1.4, sideY, -OUTER_D / 2 + 0.6);
      frontDoor.rotation.y = FRONT_OPEN;
      rack.add(frontDoor);

      const rearLeafW = (OUTER_W - 3.5) / 2;

      const rearLeft = new THREE.Group();
      const rearLeftLeaf = makePerforatedDoorLeaf(rearLeafW, doorH);
      rearLeftLeaf.position.x = rearLeafW / 2;
      rearLeft.add(rearLeftLeaf);
      const rearLeftHandle = makeSwingHandle(14);
      rearLeftHandle.position.set(rearLeafW - 2.6, 0, -0.9);
      rearLeftHandle.rotation.y = Math.PI;
      rearLeft.add(rearLeftHandle);
      rearLeft.position.set(-OUTER_W / 2 + 1.5, sideY, OUTER_D / 2 - 0.6);
      rearLeft.rotation.y = REAR_L_OPEN;
      rack.add(rearLeft);

      const rearRight = new THREE.Group();
      const rearRightLeaf = makePerforatedDoorLeaf(rearLeafW, doorH);
      rearRightLeaf.position.x = -rearLeafW / 2;
      rearRight.add(rearRightLeaf);
      const rearRightHandle = makeSwingHandle(14);
      rearRightHandle.position.set(-(rearLeafW - 2.6), 0, -0.9);
      rearRightHandle.rotation.y = Math.PI;
      rearRight.add(rearRightHandle);
      rearRight.position.set(OUTER_W / 2 - 1.5, sideY, OUTER_D / 2 - 0.6);
      rearRight.rotation.y = REAR_R_OPEN;
      rack.add(rearRight);

      rack.add(box(1.2, doorH * 0.08, 1.2, matFrame, 0, BASE_H + INNER_H - 2, OUTER_D / 2 - 1.2));
      rack.add(box(1.2, doorH * 0.08, 1.2, matFrame, 0, BASE_H + 2, OUTER_D / 2 - 1.2));

      const interior = new THREE.PointLight(0xfff2dd, 22, 90, 2);
      interior.position.set(0, sideY, 0);
      rack.add(interior);

      return { group: rack, frontDoor, rearLeft, rearRight };
    }

    // --- Raised access floor (data hall) ---
    const TILE = 60;           // 600 mm tiles
    const FLOOR_H = 45;        // raised floor height
    const FLOOR_TILE_T = 3.2;  // tile thickness
    const FLOOR_COLS = 14;
    const FLOOR_ROWS = 12;
    const floorW = FLOOR_COLS * TILE;
    const floorD = FLOOR_ROWS * TILE;
    const floorOriginX = -floorW / 2 + TILE / 2;
    const floorOriginZ = -floorD / 2 + TILE / 2;

    // Building slab under the void
    const subfloor = new THREE.Mesh(
      new THREE.CircleGeometry(520, 64),
      matSubfloor
    );
    subfloor.rotation.x = -Math.PI / 2;
    subfloor.position.y = -0.02;
    subfloor.receiveShadow = true;
    scene.add(subfloor);

    const raisedFloor = new THREE.Group();
    scene.add(raisedFloor);

    // Void plenum / skirt so the raised height reads clearly
    const plenum = new THREE.Mesh(
      new THREE.BoxGeometry(floorW + 4, FLOOR_H - FLOOR_TILE_T, floorD + 4),
      matFloorEdge
    );
    plenum.position.y = (FLOOR_H - FLOOR_TILE_T) / 2;
    plenum.castShadow = true;
    plenum.receiveShadow = true;
    raisedFloor.add(plenum);

    // Pedestals in the void (visible along the open edge)
    const pedGeo = new THREE.CylinderGeometry(1.2, 1.6, FLOOR_H - FLOOR_TILE_T - 1, 8);
    for (let c = 0; c <= FLOOR_COLS; c += 2) {
      for (let r = 0; r <= FLOOR_ROWS; r += 2) {
        const ped = new THREE.Mesh(pedGeo, matPedestal);
        ped.position.set(
          -floorW / 2 + c * TILE,
          (FLOOR_H - FLOOR_TILE_T) / 2,
          -floorD / 2 + r * TILE
        );
        ped.castShadow = true;
        raisedFloor.add(ped);
      }
    }

    // Perforation texture for airflow tiles in the cold aisle
    function makePerfTileTexture() {
      const s = 256;
      const c = document.createElement("canvas");
      c.width = s;
      c.height = s;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#bcc6d1";
      ctx.fillRect(0, 0, s, s);
      ctx.fillStyle = "#2a3038";
      const step = 14;
      const rad = 3.2;
      for (let y = step / 2; y < s; y += step) {
        for (let x = step / 2; x < s; x += step) {
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.strokeStyle = "rgba(40,48,58,0.35)";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, s - 4, s - 4);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    const matFloorPerfMapped = new THREE.MeshStandardMaterial({
      map: makePerfTileTexture(),
      metalness: 0.35,
      roughness: 0.55,
    });

    // Two rows face-to-face across a cold aisle (extra clearance for inward-opening doors)
    const AISLE = 220; // cm clear between front doors
    const ROW_SEP = OUTER_D + AISLE;

    // Cold-aisle Z band (between the two front door lines) → perforated tiles
    const aisleZ0 = -AISLE / 2;
    const aisleZ1 = AISLE / 2;

    const tileGeo = new THREE.BoxGeometry(TILE - 0.7, FLOOR_TILE_T, TILE - 0.7);
    const dummy = new THREE.Object3D();
    const solidTiles = [];
    const solidAltTiles = [];
    const perfTiles = [];

    for (let r = 0; r < FLOOR_ROWS; r++) {
      for (let c = 0; c < FLOOR_COLS; c++) {
        const x = floorOriginX + c * TILE;
        const z = floorOriginZ + r * TILE;
        const inAisle = z >= aisleZ0 && z <= aisleZ1;
        const entry = { x, z };
        if (inAisle) perfTiles.push(entry);
        else if ((r + c) % 2 === 0) solidTiles.push(entry);
        else solidAltTiles.push(entry);
      }
    }

    function addTileInstances(list, material) {
      if (!list.length) return null;
      const mesh = new THREE.InstancedMesh(tileGeo, material, list.length);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      list.forEach((t, i) => {
        dummy.position.set(t.x, FLOOR_H - FLOOR_TILE_T / 2, t.z);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      });
      mesh.instanceMatrix.needsUpdate = true;
      raisedFloor.add(mesh);
      return mesh;
    }

    addTileInstances(solidTiles, matFloorTile);
    addTileInstances(solidAltTiles, matFloorTileAlt);
    addTileInstances(perfTiles, matFloorPerfMapped);

    // Edge trim / ramp lip
    const lipH = FLOOR_H + 0.6;
    const lipT = 3;
    [
      [floorW + lipT * 2, lipH, lipT, 0, lipH / 2, -floorD / 2 - lipT / 2],
      [floorW + lipT * 2, lipH, lipT, 0, lipH / 2, floorD / 2 + lipT / 2],
      [lipT, lipH, floorD, -floorW / 2 - lipT / 2, lipH / 2, 0],
      [lipT, lipH, floorD, floorW / 2 + lipT / 2, lipH / 2, 0],
    ].forEach(([w, h, d, x, y, z]) => {
      const lip = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matFloorEdge);
      lip.position.set(x, y, z);
      lip.castShadow = true;
      lip.receiveShadow = true;
      raisedFloor.add(lip);
    });

    const bay = new THREE.Group();
    // Cabinets sit on the raised floor deck
    bay.position.y = FLOOR_H;
    scene.add(bay);

    const racks = [];

    function placeRow(names, z, rotY, xShift = 0, extrasByName = {}, equipmentByName = {}) {
      names.forEach((name, i) => {
        const unit = createRack(
          name,
          extrasByName[name] || [],
          equipmentByName[name] || []
        );
        // Base LTR layout, plus optional row shift
        const x = (names.length - 1 - i) * RACK_PITCH - RACK_PITCH + xShift;
        unit.group.position.set(x, 0, z);
        unit.group.rotation.y = rotY;
        bay.add(unit.group);
        racks.push(unit);
      });
    }

    // Row A — fronts face the aisle (-Z): Rack1, Rack2, Rack3
    placeRow(["Rack1", "Rack2", "Rack3"], ROW_SEP / 2, 0, 0);
    // Row B — turned 180°, shifted one bay so:
    //   Rack1 → empty | Rack2 ↔ Rack4 | Rack3 ↔ Rack5 | empty ← Rack6
    placeRow(
      ["Rack4", "Rack5", "Rack6"],
      -ROW_SEP / 2,
      Math.PI,
      -RACK_PITCH,
      { Rack5: ["ACS"], Rack6: ["UPS"] },
      {
        // APC Smart-UPS On-Line SRTG15KXLI 15kVA — 7U at bottom of Rack6
        Rack6: [{ type: "ups-srtg15", startU: 0 }],
      }
    );

    // Floor aisle markings — blue cold aisle, red hot aisles
    function makeFloorMark(text, fillColor, widthCm, depthCm) {
      const pw = 1024;
      const ph = 256;
      const c = document.createElement("canvas");
      c.width = pw;
      c.height = ph;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, pw, ph);
      // Soft lane paint under text for contrast on grey tiles
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.fillRect(0, ph * 0.18, pw, ph * 0.64);
      ctx.fillStyle = fillColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `800 ${Math.floor(ph * 0.5)}px "Archivo Black", "Arial Black", sans-serif`;
      ctx.fillText(text, pw / 2, ph / 2 + 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        transparent: true,
        roughness: 0.85,
        metalness: 0.05,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthCm, depthCm), mat);
      mesh.rotation.x = -Math.PI / 2;
      return mesh;
    }

    const markY = FLOOR_H + 0.2;
    // Cold aisle between the two rows (fronts face each other)
    const coldMark = makeFloorMark("COLD AISLE", "#1a5cff", 160, 28);
    coldMark.position.set(-RACK_PITCH / 2, markY, 0);
    raisedFloor.add(coldMark);

    // Hot aisles at the rear of each row
    const hotA = makeFloorMark("HOT AISLE", "#e11d2e", 140, 26);
    hotA.position.set(0, markY, ROW_SEP / 2 + OUTER_D / 2 + 28);
    raisedFloor.add(hotA);

    const hotB = makeFloorMark("HOT AISLE", "#e11d2e", 140, 26);
    hotB.rotation.z = Math.PI; // readable when facing that row's rear
    hotB.position.set(-RACK_PITCH, markY, -(ROW_SEP / 2 + OUTER_D / 2 + 28));
    raisedFloor.add(hotB);

    // Door controls drive all six cabinets
    const doorState = {
      frontOpen: true,
      rearOpen: true,
      frontTarget: FRONT_OPEN,
      rearLTarget: REAR_L_OPEN,
      rearRTarget: REAR_R_OPEN,
    };

    const btnFront = document.getElementById("btn-front");
    const btnRear = document.getElementById("btn-rear");

    function syncDoorButton(btn, isOpen, noun) {
      btn.classList.toggle("open", isOpen);
      btn.setAttribute("aria-pressed", String(isOpen));
      btn.querySelector(".action").textContent = isOpen ? "Close" : "Open";
      btn.setAttribute("aria-label", `${isOpen ? "Close" : "Open"} ${noun}`);
    }

    function nudgeIdle() {
      controls.autoRotate = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { controls.autoRotate = true; }, 4500);
    }

    function setFrontDoor(open) {
      doorState.frontOpen = open;
      doorState.frontTarget = open ? FRONT_OPEN : FRONT_CLOSED;
      syncDoorButton(btnFront, open, "front doors");
      nudgeIdle();
    }

    function setRearDoors(open) {
      doorState.rearOpen = open;
      doorState.rearLTarget = open ? REAR_L_OPEN : REAR_L_CLOSED;
      doorState.rearRTarget = open ? REAR_R_OPEN : REAR_R_CLOSED;
      syncDoorButton(btnRear, open, "rear doors");
      nudgeIdle();
    }

    btnFront.addEventListener("click", () => setFrontDoor(!doorState.frontOpen));
    btnRear.addEventListener("click", () => setRearDoors(!doorState.rearOpen));
    document.querySelector(".door-controls").addEventListener("pointerdown", (e) => e.stopPropagation());
    syncDoorButton(btnFront, true, "front doors");
    syncDoorButton(btnRear, true, "rear doors");

    // Lighting
    // Stronger key/fill separation so metal edges and door mesh read on phone
    scene.add(new THREE.AmbientLight(0xdde5ee, 0.55));

    const key = new THREE.DirectionalLight(0xfff4e6, 1.85);
    key.position.set(140, 200, -40);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 10;
    key.shadow.camera.far = 700;
    key.shadow.camera.left = -280;
    key.shadow.camera.right = 280;
    key.shadow.camera.top = 220;
    key.shadow.camera.bottom = -80;
    key.shadow.bias = -0.0002;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9ec5ef, 1.15);
    fill.position.set(-140, 90, 60);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.85);
    rim.position.set(20, 70, 160);
    scene.add(rim);

    const bounce = new THREE.PointLight(0xffffff, 90, 340, 2);
    bounce.position.set(0, FLOOR_H + 20, 0);
    scene.add(bounce);

    // Aisle light to lift door faces and equipment bezels
    const aisleLight = new THREE.PointLight(0xe8f2ff, 110, 280, 2);
    aisleLight.position.set(0, FLOOR_H + 140, 0);
    scene.add(aisleLight);

    const framingBox = new THREE.Box3();
    function frameScene(forceReset = true) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const mobile = isMobile();

      camera.fov = mobile ? 54 : 40;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      framingBox.setFromObject(bay);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      framingBox.getSize(size);
      framingBox.getCenter(center);

      const padX = mobile ? 1.35 : 1.2;
      const padY = mobile ? 1.5 : 1.25;
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
      const distY = (size.y * padY * 0.5) / Math.tan(vFov / 2);
      const distX = (size.x * padX * 0.5) / Math.tan(hFov / 2);
      const distZ = (size.z * padX * 0.5) / Math.tan(hFov / 2);
      const distance = Math.max(distX, distY, distZ) * (mobile ? 1.1 : 1.05);

      controls.target.copy(center);
      if (mobile) controls.target.y = center.y * 0.98;
      controls.minDistance = Math.max(40, distance * 0.3);
      controls.maxDistance = Math.max(1400, distance * 3.5);

      if (forceReset) {
        // Elevated view looking down the cold aisle between the two rows
        const dir = new THREE.Vector3(0.75, mobile ? 0.42 : 0.48, 0.35).normalize();
        camera.position.copy(center).addScaledVector(dir, distance);
        controls.update();
      }
    }

    frameScene(true);

    const clock = new THREE.Clock();

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      frameScene(true);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => setTimeout(() => frameScene(true), 200));

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      const ease = 1 - Math.exp(-dt * 7);

      racks.forEach(({ frontDoor, rearLeft, rearRight }) => {
        frontDoor.rotation.y += (doorState.frontTarget - frontDoor.rotation.y) * ease;
        rearLeft.rotation.y += (doorState.rearLTarget - rearLeft.rotation.y) * ease;
        rearRight.rotation.y += (doorState.rearRTarget - rearRight.rotation.y) * ease;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
